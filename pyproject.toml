[project]
name = "gridwise-llm"
version = "0.1.0"
description = "GridWise — LLM-assisted operator directive interpretation and 24-hour campus energy optimization (BUP CSE Fest 2026 preliminary)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "scipy>=1.14",
    "openai>=1.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's canonical dependency-injection pattern uses Depends() in defaults.
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[[tool.mypy.overrides]]
module = "scipy.optimize"
ignore_missing_imports = true

